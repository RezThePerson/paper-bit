name: Deploy to Vercel

on:
    push:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Deploy to Vercel Production
              run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
